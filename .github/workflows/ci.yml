name: Node.js CI/CD for React.js + TypeScript

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: 🔧 Build React.js App
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      # 1. Checkout repo
      - name: 📦 Checkout code
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: 🔧 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      # 3. Install dependencies
      - name: 📥 Install dependencies
        run: npm install

      # 4. TypeScript type checking
      - name: 🧼 Run TypeScript check
        run: npx tsc --noEmit

      # 5. Build the Next.js app
      - name: 🏗️ Build the app
        run: npm run build

  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: 📥 Install dependencies
        run: npm install

    #   - name: ✅ Run tests
    #     run: npm test







